<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Estadísticas Pokémon · Torneo 0% Reg MC</title>
<style>
:root{color-scheme:dark;--panel:#151f30;--line:#2a3a52;--text:#eef4ff;--muted:#a9b8cc;--accent:#62d6a5;--blue:#79aaff;--warn:#f5c56a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#111d30 0,#0d1421 360px);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--blue)}.wrap{max-width:900px;margin:auto;padding:22px 16px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}.brand{font-weight:800;letter-spacing:.02em}
.back{display:inline-block;padding:9px 13px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--text)}
h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:12px 0 8px}h2{font-size:20px;margin:0}
.muted{color:var(--muted)}.pokemon-heading{display:flex;align-items:center;gap:14px;margin:12px 0 18px}.pokemon-heading h1{margin:0}.pokemon-sprite{width:88px;height:88px;object-fit:contain;flex:0 0 88px}
.stat{display:inline-block;background:#21354a;color:#bfe8d7;border-radius:99px;padding:6px 11px;font-weight:750;margin:8px 0 18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.usage-lines{display:grid;gap:10px}.companion-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}.companion-name{display:flex;align-items:center;gap:8px;min-width:0}.companion-sprite{width:30px;height:30px;object-fit:contain;flex:0 0 30px}.companion-line a{color:var(--text);text-decoration:none}.companion-line a:hover{color:var(--accent);text-decoration:underline}.companion-line small{grid-column:1/-1;color:var(--muted);font-size:12px}.usage-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}.usage-line span:first-child{overflow-wrap:anywhere}.usage-line b{font-variant-numeric:tabular-nums}.usage-line small{grid-column:1/-1;color:var(--muted);font-size:12px}.item-name{display:flex;align-items:center;gap:8px;min-width:0}.item-sprite{width:30px;height:30px;object-fit:contain;flex:0 0 30px}.nature-up{color:#e05252;font-weight:750}.nature-down{color:#4b9ce2;font-weight:750}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.pending{color:var(--warn)}
</style>
</head>
<body><main class="wrap">
<header><div class="brand">TORNEO 0% REG MC</div><a class="back" href="./estadisticas.html">← Volver a estadísticas</a></header>
<div class="pokemon-heading"><img id="pokemonSprite" class="pokemon-sprite" alt="" hidden><h1 id="pokemonName">Estadísticas Pokémon</h1></div>
<div class="stat" id="usage">Cargando uso…</div>
<div id="details"></div>
<p class="muted" id="note">Cargando datos…</p>
</main>
<script>
const $=id=>document.getElementById(id);
const clean=v=>String(v??'').trim();
const pct=(n,d)=>d?((100*n/d).toFixed(1).replace('.',',')+'%'):'—';
const natureChanges={
 'Lonely':['Atk','Def'],'Brave':['Atk','Spe'],'Adamant':['Atk','SpA'],'Naughty':['Atk','SpD'],
 'Bold':['Def','Atk'],'Relaxed':['Def','Spe'],'Impish':['Def','SpA'],'Lax':['Def','SpD'],
 'Timid':['Spe','Atk'],'Hasty':['Spe','Def'],'Jolly':['Spe','SpA'],'Naive':['Spe','SpD'],
 'Modest':['SpA','Atk'],'Mild':['SpA','Def'],'Quiet':['SpA','Spe'],'Rash':['SpA','SpD'],
 'Calm':['SpD','Atk'],'Gentle':['SpD','Def'],'Sassy':['SpD','Spe'],'Careful':['SpD','SpA']
};
const itemSpriteOverrides={
 'baya-zidra':'https://img.pokemondb.net/sprites/items/sitrus-berry.png',
 'sitrus-berry':'https://img.pokemondb.net/sprites/items/sitrus-berry.png',
 'restos':'https://img.pokemondb.net/sprites/items/leftovers.png',
 'leftovers':'https://img.pokemondb.net/sprites/items/leftovers.png',
 'focus-sash':'https://img.pokemondb.net/sprites/items/focus-sash.png',
 'life-orb':'https://img.pokemondb.net/sprites/items/life-orb.png',
 'baya-caquic':'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/gen5/persim-berry.png',
 'baya-acardo':'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/gen5/shuca-berry.png',
 'shuca-berry':'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/gen5/shuca-berry.png',
 'chimechite':'https://images.wikidexcdn.net/mwuploads/wikidex/5/5c/latest/20260416200347/Chimechita_Champions.png',
 'drampanite':'https://images.wikidexcdn.net/mwuploads/wikidex/a/a2/latest/20260416200331/Drampanita_Champions.png',
 'starminite':'https://images.wikidexcdn.net/mwuploads/wikidex/2/23/latest/20260416200328/Starmita_Champions.png',
 'barbaracite':'https://images.wikidexcdn.net/mwuploads/wikidex/e/ea/latest/20260617225305/Barbaraclita_Champions.png',
 'chandelurite':'https://images.wikidexcdn.net/mwuploads/wikidex/0/0d/latest/20260416200425/Chandelurita_Champions.png',
 'eelektrossite':'https://images.wikidexcdn.net/mwuploads/wikidex/5/5b/latest/20260617233628/Eelektrossita_Champions.png',
 'feraligatrite':'https://images.wikidexcdn.net/mwuploads/wikidex/e/e8/latest/20260416200419/Feraligatrita_Champions.png',
 'malamarite':'https://images.wikidexcdn.net/mwuploads/wikidex/3/32/latest/20260617224722/Malamarita_Champions.png',
 'meganiumite':'https://images.wikidexcdn.net/mwuploads/wikidex/9/9d/latest/20260416200403/Meganiumita_Champions.png'
};
function renderSection(title,members,key){
 const isMoves=key==='moves';
 const known=members.filter(m=>isMoves?Array.isArray(m.moves)&&m.moves.some(move=>clean(move)):!!clean(m[key]));
 const counts=new Map();
 for(const m of known){
  const values=isMoves?[...new Set(m.moves.map(clean).filter(Boolean))]:[clean(m[key])];
  for(const value of values){const id=value.toLocaleLowerCase('en');const row=counts.get(id)||{name:value,count:0};row.count++;counts.set(id,row)}
 }
 const section=document.createElement('section');section.className='panel';
 const head=document.createElement('div');head.className='panel-head';
 const heading=document.createElement('h2');heading.textContent=title;
 head.append(heading);section.append(head);
 if(!counts.size){const empty=document.createElement('div');empty.className='empty pending';empty.textContent=members.length?'Pendiente de comunicar':'Sin datos registrados todavía';section.append(empty);return section}
 const lines=document.createElement('div');lines.className='usage-lines';
 [...counts.values()].sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name)).forEach(item=>{
  const line=document.createElement('div');line.className='usage-line';
  const name=document.createElement('span'),value=document.createElement('b');
  name.textContent=item.name;value.textContent=pct(item.count,known.length);
  if(key==='nature'){
   const change=natureChanges[item.name];
   if(change){
    name.textContent='';
    const label=document.createElement('span');label.textContent=item.name+' (';
    const up=document.createElement('span');up.className='nature-up';up.textContent='+'+change[0];
    const down=document.createElement('span');down.className='nature-down';down.textContent='-'+change[1];
    const close=document.createElement('span');close.textContent=')';
    name.append(label,up,document.createTextNode(', '),down,close);
   }
  }
  if(key==='item'){
   const itemName=document.createElement('span');itemName.className='item-name';
   const slug=item.name.toLocaleLowerCase('en').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
   const img=document.createElement('img');img.className='item-sprite';img.src=itemSpriteOverrides[slug]||'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/'+slug+'.png';img.alt='';img.loading='lazy';
   const fallbackSources={
    'baya-zidra':['https://img.pokemondb.net/sprites/items/sitrus-berry.png','https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/items/sitrus-berry.png'],
    'sitrus-berry':['https://img.pokemondb.net/sprites/items/sitrus-berry.png','https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/items/sitrus-berry.png'],
    'restos':['https://img.pokemondb.net/sprites/items/leftovers.png','https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/items/leftovers.png'],
    'leftovers':['https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/items/gen5/leftovers.png','https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/gen5/leftovers.png'],
    'focus-sash':['https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/items/focus-sash.png','https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/gen5/focus-sash.png','https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/items/gen5/focus-sash.png'],
    'life-orb':['https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/items/life-orb.png','https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/gen5/life-orb.png','https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/items/gen5/life-orb.png']
   };
   const fallbacks=fallbackSources[slug]||['https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/gen5/'+slug+'.png','https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/items/'+slug+'.png','https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/items/gen5/'+slug+'.png'];
   img.onerror=()=>{const next=Number(img.dataset.fallbackIndex||0);if(next<fallbacks.length){img.dataset.fallbackIndex=String(next+1);img.src=fallbacks[next]}else img.remove()};
   itemName.append(img,name);line.append(itemName,value);
  }else line.append(name,value);
  lines.append(line);
 });
 section.append(lines);return section;
}

function renderCompanions(teams,requested,aliases,sprites,denominator){
 const counts=new Map();
 for(const team of teams){
  const canonical=team.members.map(m=>aliases[m.name]||m.name);
  if(!canonical.includes(requested))continue;
  for(const name of new Set(canonical)){
   if(name===requested)continue;
   counts.set(name,(counts.get(name)||0)+1);
  }
 }
 const section=document.createElement('section');section.className='panel';
 const head=document.createElement('div');head.className='panel-head';
 const heading=document.createElement('h2');heading.textContent='Acompañantes';
 head.append(heading);section.append(head);
 if(!counts.size){const empty=document.createElement('div');empty.className='empty';empty.textContent='No hay acompañantes registrados todavía.';section.append(empty);return section}
 const lines=document.createElement('div');lines.className='usage-lines';
 [...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'es')).forEach(([name,count])=>{
  const line=document.createElement('div');line.className='companion-line';
  const nameWrap=document.createElement('div');nameWrap.className='companion-name';
  const spriteUrl=sprites[name];if(spriteUrl){const img=document.createElement('img');img.className='companion-sprite';img.src=spriteUrl;img.alt='';img.loading='lazy';img.onerror=()=>img.remove();nameWrap.append(img)}
  const link=document.createElement('a');link.href='./pokemon.html?name='+encodeURIComponent(name);link.textContent=name;nameWrap.append(link);
  const value=document.createElement('b');value.textContent=pct(count,denominator);
  line.append(nameWrap,value);lines.append(line);
 });
 section.append(lines);return section;
}

const params=new URLSearchParams(location.search),requested=params.get('name');
Promise.all([fetch('./estadisticas-data.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('HTTP '+response.status);return response.json()}),fetch('./estadisticas-pool.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('HTTP '+response.status);return response.json()})]).then(([data,poolData])=>{
 const teams=data.teams||[],members=[],pool=poolData.names||[],aliases=poolData.aliases||{},sprites=poolData.sprites||{};
 let usage=0;
 for(const team of teams){const found=team.members.filter(m=>(aliases[m.name]||m.name)===requested);if(found.length){usage++;members.push(...found)}}
 if(!requested||!pool.includes(requested)){$('pokemonName').textContent='Pokémon no encontrado';$('usage').textContent='';$('details').innerHTML='<div class="empty">No existe en la pool actual.</div>';$('note').textContent='Comprueba el nombre o vuelve al listado.';return}
 $('pokemonName').textContent=requested;
 const pokemonSprite=$('pokemonSprite'),spriteUrl=sprites[requested];if(spriteUrl){pokemonSprite.src=spriteUrl;pokemonSprite.alt='Sprite de '+requested;pokemonSprite.hidden=false;pokemonSprite.onerror=()=>pokemonSprite.hidden=true}
 $('usage').textContent=pct(usage,teams.length)+' de uso';
 $('details').append(renderSection('Movimientos',members,'moves'));
 $('details').append(renderSection('Objetos',members,'item'));
 $('details').append(renderSection('Habilidades',members,'ability'));
 $('details').append(renderSection('Naturalezas',members,'nature'));
 $('details').append(renderCompanions(teams,requested,aliases,sprites,usage));

 $('note').textContent='';
}).catch(error=>{$('pokemonName').textContent='Error al cargar las estadísticas';$('note').textContent=error.message});
</script>
</body></html>
