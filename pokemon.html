<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Estadísticas Pokémon · Torneo 0% Reg MC</title>
<style>
:root{color-scheme:dark;--panel:#151f30;--line:#2a3a52;--text:#eef4ff;--muted:#a9b8cc;--accent:#62d6a5;--blue:#79aaff;--warn:#f5c56a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#111d30 0,#0d1421 360px);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--blue)}.wrap{max-width:900px;margin:auto;padding:22px 16px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}.brand{font-weight:800;letter-spacing:.02em}
.back{display:inline-block;padding:9px 13px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--text)}
h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:12px 0 8px}h2{font-size:20px;margin:0}
.lead,.muted{color:var(--muted)}.lead{margin:0 0 20px}
.stat{display:inline-block;background:#21354a;color:#bfe8d7;border-radius:99px;padding:6px 11px;font-weight:750;margin:8px 0 18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.usage-lines{display:grid;gap:10px}.companion-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}.companion-name{display:flex;align-items:center;gap:8px;min-width:0}.companion-sprite{width:30px;height:30px;object-fit:contain;flex:0 0 30px}.companion-line a{color:var(--text);text-decoration:none}.companion-line a:hover{color:var(--accent);text-decoration:underline}.companion-line small{grid-column:1/-1;color:var(--muted);font-size:12px}.usage-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}.usage-line span:first-child{overflow-wrap:anywhere}.usage-line b{font-variant-numeric:tabular-nums}.usage-line small{grid-column:1/-1;color:var(--muted);font-size:12px}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.pending{color:var(--warn)}
</style>
</head>
<body><main class="wrap">
<header><div class="brand">TORNEO 0% REG MC</div><a class="back" href="./estadisticas.html">← Volver a estadísticas</a></header>
<h1 id="pokemonName">Estadísticas Pokémon</h1>
<p class="lead">Porcentajes calculados a partir de los equipos registrados. Los datos pendientes no se incluyen en las muestras.</p>
<div class="stat" id="usage">Cargando uso…</div>
<div id="details"></div>
<p class="muted" id="note">Cargando datos…</p>
</main>
<script>
const $=id=>document.getElementById(id);
const clean=v=>String(v??'').trim();
const pct=(n,d)=>d?((100*n/d).toFixed(1).replace('.',',')+'%'):'—';
function renderSection(title,members,key){
 const isMoves=key==='moves';
 const known=members.filter(m=>isMoves?Array.isArray(m.moves)&&m.moves.some(move=>clean(move)):!!clean(m[key]));
 const counts=new Map();
 for(const m of known){
  const values=isMoves?[...new Set(m.moves.map(clean).filter(Boolean))]:[clean(m[key])];
  for(const value of values){const id=value.toLocaleLowerCase('en');const row=counts.get(id)||{name:value,count:0};row.count++;counts.set(id,row)}
 }
 const section=document.createElement('section');section.className='panel';
 const head=document.createElement('div');head.className='panel-head';
 const heading=document.createElement('h2');heading.textContent=title;
 const sample=document.createElement('span');sample.className='muted';sample.textContent='Muestra '+known.length+'/'+members.length;
 head.append(heading,sample);section.append(head);
 if(!counts.size){const empty=document.createElement('div');empty.className='empty pending';empty.textContent=members.length?'Pendiente de comunicar':'Sin datos registrados todavía';section.append(empty);return section}
 const lines=document.createElement('div');lines.className='usage-lines';
 [...counts.values()].sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name)).forEach(item=>{
  const line=document.createElement('div');line.className='usage-line';
  const name=document.createElement('span'),value=document.createElement('b'),sampleText=document.createElement('small');
  name.textContent=item.name;value.textContent=pct(item.count,known.length);
  sampleText.textContent=item.count+'/'+known.length+' Pokémon';
  line.append(name,value,sampleText);lines.append(line);
 });
 section.append(lines);return section;
}

function renderCompanions(teams,requested,aliases,sprites,denominator){
 const counts=new Map();
 for(const team of teams){
  const canonical=team.members.map(m=>aliases[m.name]||m.name);
  if(!canonical.includes(requested))continue;
  for(const name of new Set(canonical)){
   if(name===requested)continue;
   counts.set(name,(counts.get(name)||0)+1);
  }
 }
 const section=document.createElement('section');section.className='panel';
 const head=document.createElement('div');head.className='panel-head';
 const heading=document.createElement('h2');heading.textContent='Acompañantes';
 const sample=document.createElement('span');sample.className='muted';sample.textContent='Muestra: '+denominator+' equipo(s)';
 head.append(heading,sample);section.append(head);
 if(!counts.size){const empty=document.createElement('div');empty.className='empty';empty.textContent='No hay acompañantes registrados todavía.';section.append(empty);return section}
 const lines=document.createElement('div');lines.className='usage-lines';
 [...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'es')).forEach(([name,count])=>{
  const line=document.createElement('div');line.className='companion-line';
  const nameWrap=document.createElement('div');nameWrap.className='companion-name';
  const spriteUrl=sprites[name];if(spriteUrl){const img=document.createElement('img');img.className='companion-sprite';img.src=spriteUrl;img.alt='';img.loading='lazy';img.onerror=()=>img.remove();nameWrap.append(img)}
  const link=document.createElement('a');link.href='./pokemon.html?name='+encodeURIComponent(name);link.textContent=name;nameWrap.append(link);
  const value=document.createElement('b');value.textContent=pct(count,denominator);
  const sampleText=document.createElement('small');sampleText.textContent=count+'/'+denominator+' equipos';
  line.append(nameWrap,value,sampleText);lines.append(line);
 });
 section.append(lines);return section;
}

const params=new URLSearchParams(location.search),requested=params.get('name');
Promise.all([fetch('./estadisticas-data.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('HTTP '+response.status);return response.json()}),fetch('./estadisticas-pool.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('HTTP '+response.status);return response.json()})]).then(([data,poolData])=>{
 const teams=data.teams||[],members=[],pool=poolData.names||[],aliases=poolData.aliases||{},sprites=poolData.sprites||{};
 let usage=0;
 for(const team of teams){const found=team.members.filter(m=>(aliases[m.name]||m.name)===requested);if(found.length){usage++;members.push(...found)}}
 if(!requested||!pool.includes(requested)){$('pokemonName').textContent='Pokémon no encontrado';$('usage').textContent='';$('details').innerHTML='<div class="empty">No existe en la pool actual.</div>';$('note').textContent='Comprueba el nombre o vuelve al listado.';return}
 $('pokemonName').textContent=requested;
 $('usage').textContent=pct(usage,teams.length)+' de uso · '+usage+'/'+teams.length+' equipos';
 $('details').append(renderSection('Movimientos',members,'moves'));
 $('details').append(renderSection('Objetos',members,'item'));
 $('details').append(renderSection('Habilidades',members,'ability'));
 $('details').append(renderSection('Naturalezas',members,'nature'));
 $('details').append(renderCompanions(teams,requested,aliases,sprites,usage));

 const missingNature=members.filter(m=>!clean(m.nature)).length,missingItem=members.filter(m=>!clean(m.item)).length;
 $('note').textContent='Datos de '+members.length+' ejemplar(es) en '+usage+' equipo(s). Pendientes en esta ficha: '+missingNature+' naturalezas y '+missingItem+' objetos.';
}).catch(error=>{$('pokemonName').textContent='Error al cargar las estadísticas';$('note').textContent=error.message});
</script>
</body></html>
