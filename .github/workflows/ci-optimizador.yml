name: Optimizer CI
on:
  push:
    branches:
      - feature/optimizador-pc
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: optimizer-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-optimizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Champions spreads importer
        run: python -m unittest discover -s tests -p "test_import_champions_spreads.py" -v
      - name: Test PC heuristic optimizer
        run: node --test tests/test_optimizador_heuristic.mjs
      - name: Test Mega Starmie pool regression
        run: node --test tests/test_mega_starmie_pool.mjs
      - name: Test damage and KO probability calculations
        run: node --test tests/test_optimizador_ko.mjs
      - name: Test Champions speed benchmarks
        run: node --test tests/test_optimizador_speed.mjs
      - name: Test selected ability mapping
        run: node --test tests/test_optimizador_ability.mjs
      - name: Install pinned calculator and browser test runtime
        run: npm install --no-save --ignore-scripts @smogon/calc@0.12.0 playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Test real Smogon Champions runtime integration
        run: node --test tests/test_optimizador_runtime.mjs
      - name: Test optimizer in desktop and mobile browsers
        run: node --test tests/test_optimizador_browser.mjs
      - name: Check optimizer JavaScript syntax
        run: |
          node --check optimizador-heuristic.js
          node --check optimizador-smogon.js
          node --check optimizador-search.js
          node --check optimizador-speed.js
          node --check tests/test_optimizador_speed.mjs
          node --check tests/test_mega_starmie_pool.mjs
          node --check optimizador-data.js
          node --check tests/test_optimizador_runtime.mjs
          node --check tests/test_optimizador_browser.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('optimizador.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">(.*?)</script>', source, re.S)
          if not match:
              raise SystemExit('No se encontró el módulo JavaScript del optimizador')
          Path('/tmp/optimizador-inline.mjs').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/optimizador-inline.mjs
