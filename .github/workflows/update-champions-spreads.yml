name: Update Champions M-C PC spreads
on:
  workflow_dispatch:
    inputs:
      stats_month:
        description: "Smogon stats month (YYYY-MM); blank means previous month"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: champions-pc-spreads-${{ github.ref }}
  cancel-in-progress: false
jobs:
  import-spreads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test importer
        run: python -m unittest discover -s tests -p "test_import_champions_spreads.py" -v
      - name: Test PC heuristic optimizer
        run: node --test tests/test_optimizador_heuristic.mjs
      - name: Test damage probability calculations
        run: node --test tests/test_optimizador_ko.mjs
      - name: Install pinned Champions damage engine for integration tests
        run: npm install --no-save --ignore-scripts @smogon/calc@0.12.0
      - name: Test real Smogon Champions runtime integration
        run: node --test tests/test_optimizador_runtime.mjs
      - name: Test selected ability mapping
        run: node --test tests/test_optimizador_ability.mjs
      - name: Check optimizer JavaScript syntax
        run: |
          node --check optimizador-heuristic.js
          node --check optimizador-smogon.js
          node --check optimizador-ko.js
          node --check tests/test_optimizador_runtime.mjs
          node --check optimizador-search.js
          node --check optimizador-data.js
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('optimizador.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">(.*?)</script>', source, re.S)
          if not match:
              raise SystemExit('No se encontró el módulo JavaScript del optimizador')
          Path('/tmp/optimizador-inline.mjs').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/optimizador-inline.mjs
      - name: Import previous month's Champions BO3 spreads
        run: |
          if [ -n "${{ inputs.stats_month }}" ]; then
            python scripts/import_champions_spreads.py --month "${{ inputs.stats_month }}"
          else
            python scripts/import_champions_spreads.py
          fi
      - name: Commit to the development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ev-spreads.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Champions M-C PC usage spreads"
            git push
          else
            echo "No spread data changes."
          fi
